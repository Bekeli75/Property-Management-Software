# Wasmer Edge app config - Propentra API (backend/)
#
# Format: `wasmer.io/App.v1` entity. The git-builder parses this exact schema:
#   kind  -> entity kind (required)
#   meta  -> EntityMeta { name } (required)
#   spec  -> AppV1Spec { aliases, workload } (required)
#   spec.workload.source -> the webc package to run; "." = the package built
#                           from this repo in this build (required)
#   spec.workload.capabilities -> runtime capabilities (optional)
#
# Env vars, the managed MySQL database, and the region are configured in the
# Wasmer Dashboard (App -> Settings), NOT in this file. See docs/DEPLOYMENT.md.
kind: wasmer.io/App.v1
meta:
  name: propentra-api
spec:
  aliases: []
  workload:
    source: "."
    capabilities: {}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#080f1a"/>
    </linearGradient>
    <linearGradient id="sidebar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080f1a"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111c2f"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="cardAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="100%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect fill="url(#bg)" width="1400" height="900"/>
  <!-- Sidebar -->
  <rect fill="url(#sidebar)" x="0" y="0" width="280" height="900"/>
  <text x="140" y="60" font-family="system-ui" font-size="18" font-weight="bold" fill="#5eead4" text-anchor="middle">Propentra</text>
  <text x="140" y="85" font-family="system-ui" font-size="10" fill="#5eead4" text-anchor="middle">Property Management</text>
  <!-- Nav items -->
  <g font-family="system-ui" font-size="13" fill="#64748b">
    <text x="30" y="140">Overview</text>
    <text x="30" y="175">Dashboard</text>
    <text x="30" y="220">Management</text>
    <text x="30" y="255">Properties</text>
    <text x="30" y="290">Tenants</text>
    <text x="30" y="325">Leases</text>
    <text x="30" y="370">Operations</text>
    <text x="30" y="405">Payments</text>
    <text x="30" y="440">Maintenance</text>
    <text x="30" y="475">Reports</text>
    <text x="30" y="520">Communication</text>
    <text x="30" y="555">Discussion</text>
    <text x="30" y="590">Notifications</text>
  </g>
  <!-- Active indicator -->
  <rect fill="url(#primary)" x="0" y="170" width="4" height="24"/>
  <text x="30" y="189" font-family="system-ui" font-size="13" font-weight="bold" fill="#5eead4">Dashboard</text>
  <!-- Header -->
  <rect fill="#111c2f" x="280" y="0" width="1120" height="80" opacity="0.95"/>
  <rect fill="#1e293b" x="280" y="80" width="1120" height="1"/>
  <text x="320" y="50" font-family="system-ui" font-size="20" font-weight="bold" fill="#f8fafc">Dashboard</text>
  <text x="320" y="70" font-family="system-ui" font-size="12" fill="#94a3b8">Keep tenant agreements, rent terms, and attachments organized.</text>
  <!-- Stats cards - Premium gradient cards -->
  <g>
    <!-- Card 1 -->
    <rect x="320" y="110" width="240" height="110" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <ellipse cx="440" cy="60" rx="120" ry="80" fill="url(#glow1)"/>
    <ellipse cx="500" cy="180" rx="100" ry="60" fill="url(#glow2)"/>
    <text x="340" y="135" font-family="system-ui" font-size="12" fill="#94a3b8">Total Leases</text>
    <text x="340" y="175" font-family="system-ui" font-size="32" font-weight="bold" fill="#f8fafc">12</text>
    <rect fill="url(#primary)" x="340" y="185" width="80" height="4" rx="2"/>
  </g>
  <g>
    <!-- Card 2 -->
    <rect x="580" y="110" width="240" height="110" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <ellipse cx="700" cy="60" rx="120" ry="80" fill="url(#glow1)"/>
    <ellipse cx="760" cy="180" rx="100" ry="60" fill="url(#glow2)"/>
    <text x="600" y="135" font-family="system-ui" font-size="12" fill="#94a3b8">Active Tenants</text>
    <text x="600" y="175" font-family="system-ui" font-size="32" font-weight="bold" fill="#f8fafc">8</text>
    <rect fill="#10b981" x="600" y="185" width="80" height="4" rx="2"/>
  </g>
  <g>
    <!-- Card 3 -->
    <rect x="840" y="110" width="240" height="110" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <ellipse cx="960" cy="60" rx="120" ry="80" fill="url(#glow1)"/>
    <ellipse cx="1020" cy="180" rx="100" ry="60" fill="url(#glow2)"/>
    <text x="860" y="135" font-family="system-ui" font-size="12" fill="#94a3b8">Monthly Revenue</text>
    <text x="860" y="175" font-family="system-ui" font-size="32" font-weight="bold" fill="#f8fafc">ETB 1.2M</text>
    <rect fill="#fbbf24" x="860" y="185" width="80" height="4" rx="2"/>
  </g>
  <g>
    <!-- Card 4 -->
    <rect x="1100" y="110" width="240" height="110" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <ellipse cx="1220" cy="60" rx="120" ry="80" fill="url(#glow1)"/>
    <ellipse cx="1280" cy="180" rx="100" ry="60" fill="url(#glow2)"/>
    <text x="1120" y="135" font-family="system-ui" font-size="12" fill="#94a3b8">Pending Maintenance</text>
    <text x="1120" y="175" font-family="system-ui" font-size="32" font-weight="bold" fill="#f8fafc">3</text>
    <rect fill="#f87171" x="1120" y="185" width="80" height="4" rx="2"/>
  </g>
  <!-- Recent activity table - Premium card -->
  <rect fill="url(#cardGrad)" x="320" y="250" width="1020" height="400" rx="16" stroke="#334155" stroke-width="1"/>
  <ellipse cx="830" cy="200" rx="300" ry="150" fill="url(#glow1)" opacity="0.4"/>
  <ellipse cx="1000" cy="550" rx="250" ry="120" fill="url(#glow2)" opacity="0.4"/>
  <text x="340" y="280" font-family="system-ui" font-size="16" font-weight="bold" fill="#f8fafc">Recent Activity</text>
  <!-- Table header -->
  <rect fill="#0b1220" x="320" y="310" width="1020" height="44" rx="12"/>
  <text x="340" y="340" font-family="system-ui" font-size="11" font-weight="bold" fill="#94a3b8">Tenant</text>
  <text x="540" y="340" font-family="system-ui" font-size="11" font-weight="bold" fill="#94a3b8">Unit</text>
  <text x="740" y="340" font-family="system-ui" font-size="11" font-weight="bold" fill="#94a3b8">Period</text>
  <text x="940" y="340" font-family="system-ui" font-size="11" font-weight="bold" fill="#94a3b8">Rent</text>
  <text x="1140" y="340" font-family="system-ui" font-size="11" font-weight="bold" fill="#94a3b8">Status</text>
  <!-- Rows -->
  <g font-family="system-ui" font-size="12" fill="#e2e8f0">
    <text x="340" y="375">Sara Ahmed</text>
    <text x="540" y="375">A-204 · Sunrise Heights</text>
    <text x="740" y="375">Jan 2025 – Dec 2025</text>
    <text x="940" y="375">ETB 18,500</text>
    <rect fill="#10b981" x="1140" y="365" width="80" height="22" rx="11"/>
    <text x="1180" y="381" font-size="10" fill="#050a14" text-anchor="middle">Active</text>
    <text x="340" y="415">Kebede Mulu</text>
    <text x="540" y="415">B-102 · Green Valley</text>
    <text x="740" y="415">Mar 2025 – Feb 2026</text>
    <text x="940" y="415">ETB 15,000</text>
    <rect fill="#10b981" x="1140" y="405" width="80" height="22" rx="11"/>
    <text x="1180" y="421" font-size="10" fill="#050a14" text-anchor="middle">Active</text>
    <text x="340" y="455">Bethlehem Wudu</text>
    <text x="540" y="455">D-202 · Cedar Executive</text>
    <text x="740" y="455">Apr 2025 – Mar 2026</text>
    <text x="940" y="455">ETB 22,000</text>
    <rect fill="#10b981" x="1140" y="445" width="80" height="22" rx="11"/>
    <text x="1180" y="461" font-size="10" fill="#050a14" text-anchor="middle">Active</text>
  </g>
  <!-- Dark mode toggle -->
  <circle cx="140" cy="840" r="20" fill="#1e293b" stroke="#5eead4" stroke-width="1"/>
  <text x="140" y="846" font-family="system-ui" font-size="14" fill="#5eead4" text-anchor="middle">☀️</text>
</svg>
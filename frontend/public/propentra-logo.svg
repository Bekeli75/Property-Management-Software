<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Side wing - left -->
  <rect x="8" y="22" width="8" height="18" rx="1.5" fill="#0d9488" opacity="0.7"/>
  <rect x="10" y="25" width="3" height="4" rx="0.6" fill="rgba(255,255,255,0.15)"/>
  <rect x="10" y="32" width="3" height="4" rx="0.6" fill="rgba(255,255,255,0.15)"/>

  <!-- Side wing - right -->
  <rect x="32" y="18" width="8" height="22" rx="1.5" fill="#0d9488" opacity="0.55"/>
  <rect x="34" y="21" width="3" height="4" rx="0.6" fill="rgba(255,255,255,0.13)"/>
  <rect x="34" y="28" width="3" height="4" rx="0.6" fill="rgba(255,255,255,0.13)"/>
  <rect x="34" y="35" width="3" height="3" rx="0.6" fill="rgba(255,255,255,0.13)"/>

  <!-- Central tower with gradient -->
  <defs>
    <linearGradient id="tower-grad" x1="16" y1="10" x2="32" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d9488"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect x="16" y="10" width="16" height="30" rx="2" fill="url(#tower-grad)"/>

  <!-- Glass windows -->
  <rect x="19" y="13" width="4" height="5" rx="0.8" fill="rgba(255,255,255,0.2)"/>
  <rect x="25" y="13" width="4" height="5" rx="0.8" fill="rgba(255,255,255,0.12)"/>
  <rect x="19" y="21" width="4" height="5" rx="0.8" fill="rgba(255,255,255,0.12)"/>
  <rect x="25" y="21" width="4" height="5" rx="0.8" fill="rgba(255,255,255,0.2)"/>
  <rect x="19" y="29" width="4" height="5" rx="0.8" fill="rgba(255,255,255,0.2)"/>
  <rect x="25" y="29" width="4" height="5" rx="0.8" fill="rgba(255,255,255,0.12)"/>

  <!-- Key accent -->
  <circle cx="35" cy="12" r="3.5" stroke="#99f6e4" stroke-width="1.6" fill="none"/>
  <line x1="38.5" y1="12" x2="42" y2="12" stroke="#99f6e4" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="40.5" y1="12" x2="40.5" y2="14.5" stroke="#99f6e4" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="42" y1="12" x2="42" y2="14" stroke="#99f6e4" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Ground line -->
  <line x1="6" y1="42" x2="44" y2="42" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
</svg>

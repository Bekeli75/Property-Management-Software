  <rect fill="#ffffff" x="280" y="0" width="1120" height="80" opacity="0.95"/>
  <rect fill="#e2e8f0" x="280" y="80" width="1120" height="1"/>
  <text x="320" y="50" font-family="system-ui" font-size="20" font-weight="bold" fill="#0f172a">Settings</text>
  <text x="320" y="70" font-family="system-ui" font-size="12" fill="#64748b">Manage your contact details and preferences.</text>
  <g font-family="system-ui">
    <rect x="320" y="120" width="1020" height="120" rx="16" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1"/>
    <ellipse cx="830" cy="100" rx="300" ry="80" fill="url(#glow1)"/>
    <ellipse cx="950" cy="200" rx="250" ry="80" fill="url(#glow2)"/>

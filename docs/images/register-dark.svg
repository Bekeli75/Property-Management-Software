<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#080f1a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111c2f"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="100%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect fill="url(#bg)" width="1400" height="900"/>
  <g transform="translate(500, 80)">
    <rect x="0" y="0" width="400" height="720" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <ellipse cx="200" cy="50" rx="150" ry="100" fill="url(#glow1)"/>
    <ellipse cx="350" cy="650" rx="120" ry="80" fill="url(#glow2)"/>
    <text x="200" y="80" font-family="system-ui" font-size="24" font-weight="bold" fill="#5eead4" text-anchor="middle">Propentra</text>
    <text x="200" y="105" font-family="system-ui" font-size="10" fill="#5eead4" text-anchor="middle">Property Management</text>
    <text x="200" y="160" font-family="system-ui" font-size="11" font-weight="600" fill="#14b8a6" text-anchor="middle" letter-spacing="0.18em">TENANT REGISTRATION</text>
    <text x="200" y="195" font-family="system-ui" font-size="28" font-weight="700" fill="#f8fafc" text-anchor="middle">Create your account</text>
    <text x="200" y="220" font-family="system-ui" font-size="14" fill="#94a3b8" text-anchor="middle">Register to access your lease, pay rent, and request maintenance.</text>
    <rect x="40" y="250" width="320" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="60" y="270" font-family="system-ui" font-size="12" fill="#64748b">e.g. Sara Ahmed</text>
    <text x="60" y="240" font-family="system-ui" font-size="11" font-weight="600" fill="#f8fafc">Full name</text>
    <rect x="40" y="320" width="320" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="60" y="340" font-family="system-ui" font-size="12" fill="#64748b">you@example.com</text>
    <text x="60" y="310" font-family="system-ui" font-size="11" font-weight="600" fill="#f8fafc">Email address</text>
    <rect x="40" y="390" width="320" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="60" y="410" font-family="system-ui" font-size="12" fill="#64748b">+251 911 234 567</text>
    <text x="60" y="360" font-family="system-ui" font-size="11" font-weight="600" fill="#f8fafc">Phone number (optional)</text>
    <rect x="40" y="460" width="320" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="60" y="480" font-family="system-ui" font-size="12" fill="#64748b">At least 8 characters</text>
    <text x="60" y="450" font-family="system-ui" font-size="11" font-weight="600" fill="#f8fafc">Password</text>
    <rect x="40" y="530" width="320" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="60" y="550" font-family="system-ui" font-size="12" fill="#64748b">Repeat your password</text>
    <text x="60" y="500" font-family="system-ui" font-size="11" font-weight="600" fill="#f8fafc">Confirm password</text>
    <rect x="40" y="600" width="320" height="52" rx="8" fill="url(#primary)"/>
    <text x="200" y="635" font-family="system-ui" font-size="14" font-weight="700" fill="#050a14" text-anchor="middle">Create account</text>
    <text x="200" y="685" font-family="system-ui" font-size="13" fill="#94a3b8" text-anchor="middle">Already have an account? <a href="#" fill="#5eead4" font-weight="600">Sign in here</a></text>
  </g>
</svg>
; Propentra API — Supervisor queue worker
; Copied by setup-vps.sh to /etc/supervisor/conf.d/propentra-api.conf
[program:propentra-api]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/propentra-api/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/propentra-api
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/propentra-queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
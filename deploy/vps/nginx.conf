# Propentra API — nginx server block (Laravel, PHP-FPM)
# Placeholders substituted by setup-vps.sh: __API_DOMAIN__ __APP_DIR__
server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    root __APP_DIR__/public;
    index index.php;

    # Uploads larger than a few MB get rejected by PHP size limits.
    client_max_body_size 12M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Serve existing files directly; otherwise Laravel.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Never serve hidden/admin files.
    location ~ /\. {
        deny all;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}